`;
/* ---------- printing ---------- */
const Printer = mkIcon('<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>');
const hx = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const prTable = (head, rows, widths) => `<table class="pr-t">${widths ? `<colgroup>${widths.map((w) => `<col style="width:${w}">`).join("")}</colgroup>` : ""}<thead><tr>${head
    .map((h) => `<th>${hx(h)}</th>`)
    .join("")}</tr></thead><tbody>${rows.length
    ? rows.map((r) => `<tr>${r.map((c) => `<td>${hx(c)}</td>`).join("")}</tr>`).join("")
    : `<tr><td colspan="${head.length}" class="pr-empty">None</td></tr>`}</tbody></table>`;
const prFacts = (pairs) => `<dl class="pr-facts">${pairs.map(([k, v]) => `<div><dt>${hx(k)}</dt><dd>${hx(v)}</dd></div>`).join("")}</dl>`;
const prH2 = (t) => `<h2>${hx(t)}</h2>`;
const prP = (t) => `<p class="pr-note">${hx(t)}</p>`;
const prStamp = () => new Date().toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });

function printHtml(title, body, s, kind) {
    let area = document.getElementById("print-area");
    if (!area) {
        area = document.createElement("div");
        area.id = "print-area";
        document.body.appendChild(area);
    }
    const head = kind === "slip"
        ? ""
        : `<header class="pr-head"><div><div class="pr-lib">${hx((s && s.library) || "Library")}</div><h1>${hx(title)}</h1></div><div class="pr-meta">Printed ${hx(prStamp())}</div></header>`;
    area.innerHTML = `<div class="pr ${kind ? "pr-" + kind : ""}">${head}${body}</div>`;
    document.body.classList.add("printing");
    const done = () => {
        document.body.classList.remove("printing");
        window.removeEventListener("afterprint", done);
    };
    window.addEventListener("afterprint", done);
    setTimeout(() => {
        window.print();
        setTimeout(done, 1500);
    }, 60);
}

function PrintButton({ onClick, label, block }) {
    return React.createElement("button", { className: `btn btn-ghost${block ? " btn-block" : ""}`, style: { whiteSpace: "nowrap", flexShrink: 0 }, onClick }, React.createElement(Printer, { size: 18 }), " ", label || "Print");
}

const loanStatus = (l, today) => {
    if (l.returned)
        return l.closedAs ? `Closed as ${l.closedAs}` : `Returned ${fmtDate(l.returned)}`;
    const late = lateDays(l, today);
    return late > 0 ? `${plural(late, "day")} late` : `Due ${fmtDate(l.due)}`;
};

const PRINT = {
    books(list, ctx, label) {
        const miss = ctx.state.missing || {};
        const rows = list.map((b) => {
            const l = ctx.d.activeByBook.get(b.sl);
            const gone = missingInfo(miss[b.sl]);
            return [b.code, b.title, b.author, b.call, `${b.shelfNo}, ${b.shelf}`, l ? `On loan, due ${fmtDate(l.due)}` : gone ? (gone.kind === "lost" ? "Lost" : "Missing") : "On shelf"];
        });
        printHtml("Book list", prP(`${plural(list.length, "book")}: ${label}.`) + prTable(["Acc.", "Title", "Author", "Call no.", "Shelf", "Status"], rows, ["7%", "33%", "20%", "12%", "11%", "17%"]), ctx.s);
    },
    borrowers(list, ctx) {
        const rows = list.map((m) => {
            const out = ctx.d.active.filter((l) => l.memberId === m.id);
            const late = out.filter((l) => l.due < ctx.today).length;
            const owed = unpaidFines(ctx.state.loans, m.id);
            return [m.id, m.name, m.group || m.type, m.phone || "", `${out.length}${late ? ` (${late} late)` : ""}`, owed ? money(owed, ctx.s) : ""];
        });
        printHtml("Borrowers", prP(plural(list.length, "borrower")) + prTable(["ID", "Name", "Class or department", "Phone", "Books out", "Owes"], rows, ["9%", "26%", "24%", "17%", "13%", "11%"]), ctx.s);
    },
    loans(list, ctx, label) {
        const rows = list.map((l) => {
            const b = BOOK_BY_SL.get(l.sl) || {};
            const m = ctx.d.memberById.get(l.memberId);
            const fine = loanFine(l, ctx.today, ctx.s);
            return [b.code, b.title, m ? `${m.name} (${m.id})` : "Removed borrower", fmtDate(l.issued), loanStatus(l, ctx.today), fine ? `${money(fine, ctx.s)}${l.returned ? (l.finePaid ? " paid" : " owed") : " so far"}` : ""];
        });
        printHtml(`Loans: ${label}`, prP(plural(list.length, "loan")) + prTable(["Acc.", "Title", "Borrower", "Issued", "Status", "Fine"], rows, ["7%", "32%", "23%", "12%", "14%", "12%"]), ctx.s);
    },
    daily(ctx) {
        const { d, today, s, state } = ctx;
        const soon = d.active.filter((l) => l.due >= today && l.due <= addDays(today, 3));
        const issuedToday = state.loans.filter((l) => l.issued === today);
        const returnedToday = state.loans.filter((l) => l.returned === today);
        const row = (l) => {
            const b = BOOK_BY_SL.get(l.sl) || {};
            const m = d.memberById.get(l.memberId);
            return [b.code, b.title, m ? `${m.name} (${m.id})` : "Removed borrower", m && m.phone ? m.phone : "", loanStatus(l, today)];
        };
        const head = ["Acc.", "Title", "Borrower", "Phone", "Status"];
        const w = ["8%", "36%", "26%", "14%", "16%"];
        const body = prFacts([
            ["On loan", d.active.length],
            ["Overdue", d.overdue.length],
            ["Issued today", issuedToday.length],
            ["Returned today", returnedToday.length],
        ]) +
            prH2("Overdue") + prTable(head, [...d.overdue].sort((a, b) => (a.due < b.due ? -1 : 1)).map(row), w) +
            prH2("Due in the next 3 days") + prTable(head, soon.map(row), w) +
            prH2("Issued today") + prTable(head, issuedToday.map(row), w) +
            prH2("Returned today") + prTable(head, returnedToday.map(row), w);
        printHtml(`Daily report, ${fmtLong(today)}`, body, s);
    },
    book(sl, ctx) {
        const b = BOOK_BY_SL.get(sl);
        const l = ctx.d.activeByBook.get(sl);
        const gone = missingInfo((ctx.state.missing || {})[sl]);
        const hist = ctx.state.loans.filter((x) => x.sl === sl).sort((a, c) => (a.issued < c.issued ? 1 : -1));
        const body = `<p class="pr-sub">${hx(b.author)}</p>` +
            prFacts([
                ["Accession no.", b.code],
                ["Call no.", b.call],
                ["Category", CATS[b.cat] ? CATS[b.cat].name : ""],
                ["Location", `${b.shelfNo}, shelf ${b.shelf}`],
                ["Status", l ? `On loan to ${(ctx.d.memberById.get(l.memberId) || {}).name || "a removed borrower"}, due ${fmtDate(l.due)}` : gone ? `${gone.kind === "lost" ? "Lost" : "Missing"} since ${fmtDate(gone.since)}` : "On shelf"],
            ]) +
            (gone && gone.note ? prP(`Note: ${gone.note}`) : "") +
            prH2("Loan history") +
            prTable(["Borrower", "Issued", "Due", "Returned", "Fine"], hist.map((x) => {
                const m = ctx.d.memberById.get(x.memberId);
                const fine = loanFine(x, ctx.today, ctx.s);
                return [m ? `${m.name} (${m.id})` : "Removed borrower", fmtDate(x.issued), fmtDate(x.due), x.returned ? fmtDate(x.returned) : "Not yet", fine ? money(fine, ctx.s) : ""];
            }), ["34%", "16%", "16%", "18%", "16%"]);
        printHtml(b.title, body, ctx.s);
    },
    borrower(m, ctx) {
        const out = ctx.d.active.filter((l) => l.memberId === m.id).sort((a, b) => (a.due < b.due ? -1 : 1));
        const past = ctx.state.loans.filter((l) => l.memberId === m.id && l.returned).sort((a, b) => (a.returned < b.returned ? 1 : -1));
        const row = (l) => {
            const b = BOOK_BY_SL.get(l.sl) || {};
            const fine = loanFine(l, ctx.today, ctx.s);
            return [b.code, b.title, fmtDate(l.issued), loanStatus(l, ctx.today), fine ? `${money(fine, ctx.s)}${l.returned ? (l.finePaid ? " paid" : " owed") : ""}` : ""];
        };
        const head = ["Acc.", "Title", "Issued", "Status", "Fine"];
        const w = ["9%", "45%", "14%", "18%", "14%"];
        const body = prFacts([
            ["ID", m.id],
            ["Type", m.type],
            ["Class or department", m.group || ""],
            ["Phone", m.phone || ""],
            ["Books out", `${out.length} of ${ctx.s.maxBooks}`],
            ["Unpaid fines", money(unpaidFines(ctx.state.loans, m.id), ctx.s)],
            ["Member since", m.joined ? fmtDate(m.joined) : ""],
        ]) + prH2("On loan") + prTable(head, out.map(row), w) + prH2("Borrowing history") + prTable(head, past.map(row), w);
        printHtml(m.name, body, ctx.s);
    },
    slip(book, member, issued, due, renewed, ctx) {
        const s = ctx.s;
        const body = `<div class="pr-slipcard">
<div class="pr-sliplib">${hx(s.library || "Library")}</div>
<div class="pr-sliphead"><span>DATE DUE</span><span>Acc. ${hx(book.code)}</span></div>
<div class="pr-slipdate">${hx(fmtDate(due).toUpperCase())}</div>
<p><b>${hx(book.title)}</b><br>${hx(book.author)}<br>Call no. ${hx(book.call)}</p>
<p>${hx(member ? `${member.name} (${member.id})` : "")}<br>${hx(renewed ? `Renewed ${fmtDate(ctx.today)}` : `Issued ${fmtDate(issued)}`)}</p>
<p class="pr-small">A fine of ${hx(money(s.finePerDay, s))} a day applies after the due date.</p></div>`;
        printHtml("Date due slip", body, s, "slip");
    },
    receipt(book, member, fine, paid, ctx) {
        const s = ctx.s;
        const body = `<div class="pr-slipcard">
<div class="pr-sliplib">${hx(s.library || "Library")}</div>
<div class="pr-sliphead"><span>RETURN RECEIPT</span><span>Acc. ${hx(book.code)}</span></div>
<p><b>${hx(book.title)}</b><br>${hx(book.author)}</p>
<p>Returned by ${hx(member ? `${member.name} (${member.id})` : "a removed borrower")}<br>on ${hx(fmtDate(ctx.today))}</p>
<p>${fine ? `Fine: ${hx(money(fine, s))}, ${paid ? "paid" : "still owed"}` : "No fine. Thank you!"}</p></div>`;
        printHtml("Return receipt", body, s, "slip");
    },
    stock(sum, scopeLabel, started, ctx, finished) {
        const row = (b) => [b.code, b.title, b.author, b.call, `${b.shelfNo}, ${b.shelf}`];
        const head = ["Acc.", "Title", "Author", "Call no.", "Shelf"];
        const w = ["8%", "38%", "22%", "14%", "18%"];
        const body = prP(`Checked ${scopeLabel}. Started ${fmtDate(started)}${finished ? `, finished ${fmtDate(finished)}` : ""}.`) +
            prFacts([
                ["Books in this check", sum.books.length],
                ["Found on the shelves", sum.checked.length],
                ["Out on loan", sum.onLoan.length],
                ["Missing", sum.missing.length],
                ["Back without check-in", sum.foundOnLoan.length],
                ["Not in the catalogue", sum.unknown.length],
            ]) +
            prH2("Missing") + prTable(head, sum.missing.map(row), w) +
            prH2("On the shelf but recorded as on loan") + prTable(head, sum.foundOnLoan.map(row), w) +
            prH2("Not in the catalogue") + prTable(["Accession no. scanned"], sum.unknown.map((u) => [u])) +
            `<div class="pr-sign"><span>Checked by</span><span>Signature</span><span>Date</span></div>`;
        printHtml("Stock verification report", body, ctx.s);
    },
    stockPast(h, ctx) {
        const miss = ctx.state.missing || {};
        const nowMissing = BOOKS.filter((b) => miss[b.sl]);
        const body = prFacts([
            ["Finished", fmtDate(h.finished)],
            ["Checked", h.scope],
            ["Books found", h.checked],
            ["Missing", h.missing],
        ]) + prH2("All books currently marked missing or lost") +
            prTable(["Acc.", "Title", "Call no.", "Shelf", "Since"], nowMissing.map((b) => {
                const g = missingInfo(miss[b.sl]);
                return [b.code, b.title, b.call, `${b.shelfNo}, ${b.shelf}`, `${g.kind === "lost" ? "Lost" : "Missing"} ${fmtDate(g.since)}`];
            }), ["8%", "44%", "15%", "15%", "18%"]);
        printHtml("Stock check summary", body, ctx.s);
    },
    notices(groups, kind, ctx) {
        const blocks = groups.map(({ member, loans }) => {
            const list = loans.map((l) => {
                const b = BOOK_BY_SL.get(l.sl) || {};
                return `<li>${hx(b.title)} <span class="pr-small">(Acc. ${hx(b.code)}, due ${hx(fmtDate(l.due))})</span></li>`;
            }).join("");
            return `<section class="pr-notice"><div class="pr-noticehead"><b>${hx(ctx.s.library || "Library")}</b><span>${hx(fmtDate(ctx.today))}</span></div>
<p>To: <b>${hx(member.name)}</b> (${hx(member.id)}${member.group ? `, ${hx(member.group)}` : ""})</p>
<p>${hx(fillMessage(kind, member, loans, ctx.s, ctx.today))}</p><ul>${list}</ul>
<p class="pr-small">Librarian's signature ____________________</p></section>`;
        }).join("");
        printHtml(kind === "overdue" ? "Overdue notices" : "Due date reminders", blocks || prP("Nobody to send a notice to."), ctx.s, "notices");
    },
};

/* ---------- small components ---------- */
function Spine({ call, cat }) {
    const i = call.indexOf(" ");
    return (React.createElement("div", { className: "spine", style: cat === undefined ? undefined : catStyle(cat), "aria-label": `Call number ${call}` },
        React.createElement("span", null, i > 0 ? call.slice(0, i) : call),
